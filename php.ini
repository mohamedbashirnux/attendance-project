-- departmetts CREATE TABLE departments (
    department_name VARCHAR(100) NOT NULL,
    faculty_name VARCHAR(100) NOT NULL,
    PRIMARY KEY (department_name, faculty_name)
);


-- databse 
CREATE TABLE classes (
    department_name VARCHAR(255),
    class_name VARCHAR(255),
    study_mode VARCHAR(100),
    faculty_name VARCHAR(255),
    FOREIGN KEY (department_name, faculty_name) REFERENCES departments(department_name, faculty_name) ON DELETE CASCADE ON UPDATE CASCADE
);
ALTER TABLE classes ADD PRIMARY KEY (department_name, class_name, study_mode, faculty_name);

subjects 
-------
CREATE TABLE subjects (
    subject_name VARCHAR(255) NOT NULL,
    department_name VARCHAR(100),
    class_name VARCHAR(255),
    study_mode VARCHAR(100),
    faculty_name VARCHAR(100),
    FOREIGN KEY (department_name, class_name, study_mode, faculty_name)
        REFERENCES classes(department_name, class_name, study_mode, faculty_name)
        ON DELETE CASCADE
        ON UPDATE CASCADE
);
  

