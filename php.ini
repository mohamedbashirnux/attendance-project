   fetch study mode in subjects  
   ===========================
   <?php
session_start();

$servername = "localhost";
$username = "root";
$password = "";
$dbname = "attendanceproject";

if (!isset($_SESSION['faculty']) || !isset($_GET['class_name'])) {
    exit('Missing required parameters');
}

$faculty = $_SESSION['faculty'];
$className = $_GET['class_name'];

$conn = new mysqli($servername, $username, $password, $dbname);

if ($conn->connect_error) {
    exit('Connection failed: ' . $conn->connect_error);
}

$sql = "SELECT DISTINCT study_mode FROM classes WHERE class_name = ? AND faculty_name = ? LIMIT 1";
$stmt = $conn->prepare($sql);
$stmt->bind_param("ss", $className, $faculty);
$stmt->execute();
$result = $stmt->get_result();

if ($row = $result->fetch_assoc()) {
    echo $row['study_mode'];
} else {
    echo 'No study mode found';
}

$stmt->close();
$conn->close();
?>


