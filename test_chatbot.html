<!DOCTYPE html>
<html>
<head>
    <title>Test AI Chatbot API</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chatbox { border: 1px solid #ccc; padding: 15px; min-height: 200px; margin: 20px 0; max-height: 500px; overflow-y: auto; }
        input { width: 70%; padding: 10px; }
        button { padding: 10px 20px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .bot { background: #f5f5f5; }
        .error { background: #ffebee; color: #c62828; }
        .suggestions { margin: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; }
        .suggestion-btn { 
            background: #2196F3; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 13px;
            transition: background 0.3s;
        }
        .suggestion-btn:hover { 
            background: #1976D2; 
        }
    </style>
</head>
<body>
    <h1>Test AI Chatbot API</h1>
    <div id="chatbox"></div>
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        // Store conversation history
        let conversationHistory = [];
        
        async function sendMessage(messageText = null) {
            const input = document.getElementById('messageInput');
            const message = messageText || input.value.trim();
            
            if (!message) return;
            
            // Display user message
            addMessage(message, 'user');
            input.value = '';
            
            // Create empty bot message for streaming
            const chatbox = document.getElementById('chatbox');
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.textContent = 'Thinking...';
            chatbox.appendChild(botDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
            
            try {
                const response = await fetch('http://localhost/attendanceproject1/app/ai_chatbot.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message: message,
                        history: conversationHistory
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Stream the response word by word
                    await streamText(botDiv, data.response);
                    
                    // Add to conversation history
                    conversationHistory.push({
                        role: 'user',
                        text: message
                    });
                    conversationHistory.push({
                        role: 'model',
                        text: data.response
                    });
                    
                    // Keep only last 10 messages (5 exchanges) to avoid token limits
                    if (conversationHistory.length > 10) {
                        conversationHistory = conversationHistory.slice(-10);
                    }
                    
                    // Display suggestion buttons if available
                    if (data.suggestions && data.suggestions.length > 0) {
                        addSuggestions(data.suggestions);
                    }
                } else {
                    botDiv.textContent = 'Error: ' + data.message;
                    botDiv.className = 'message error';
                }
            } catch (error) {
                botDiv.textContent = 'Connection error: ' + error.message;
                botDiv.className = 'message error';
            }
        }
        
        // Stream text word by word like ChatGPT
        async function streamText(element, text) {
            element.textContent = '';
            const words = text.split(' ');
            
            for (let i = 0; i < words.length; i++) {
                element.textContent += (i > 0 ? ' ' : '') + words[i];
                
                // Scroll to bottom as text appears
                const chatbox = document.getElementById('chatbox');
                chatbox.scrollTop = chatbox.scrollHeight;
                
                // Delay between words (adjust speed here)
                // Faster at start, slower for reading
                const delay = i < 5 ? 30 : 50;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
        
        function addMessage(text, type) {
            const chatbox = document.getElementById('chatbox');
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
        
        function addSuggestions(suggestions) {
            const chatbox = document.getElementById('chatbox');
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'suggestions';
            
            suggestions.forEach(suggestion => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = suggestion;
                btn.onclick = () => {
                    // Remove all suggestion buttons when one is clicked
                    document.querySelectorAll('.suggestions').forEach(el => el.remove());
                    sendMessage(suggestion);
                };
                suggestionsDiv.appendChild(btn);
            });
            
            chatbox.appendChild(suggestionsDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
        
        // Allow Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
